name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: go.sum

      - name: Debug Go env
        run: |
          go version
          go env

      - name: Install rsrc
        run: go install github.com/akavel/rsrc@latest

      - name: Generate resources
        run: |
          cd cmd/shiftr && rsrc -manifest shiftr.manifest -ico ../../assets/systray.ico -o rsrc.syso
          cd ../settings && rsrc -manifest settings.manifest -ico ../../assets/systray.ico -o rsrc.syso
          cd ../ipstatus && rsrc -manifest ipstatus.manifest -ico ../../assets/systray.ico -o rsrc.syso
          cd ../routetable && rsrc -manifest routetable.manifest -ico ../../assets/systray.ico -o rsrc.syso
          cd ../logviewer && rsrc -manifest logviewer.manifest -ico ../../assets/systray.ico -o rsrc.syso

      - name: Build
        run: |
          go build -ldflags="-H windowsgui -s -w" -trimpath -o shiftr.exe ./cmd/shiftr
          go build -ldflags="-H windowsgui -s -w" -trimpath -o settings.exe ./cmd/settings
          go build -ldflags="-H windowsgui -s -w" -trimpath -o ipstatus.exe ./cmd/ipstatus
          go build -ldflags="-H windowsgui -s -w" -trimpath -o routetable.exe ./cmd/routetable
          go build -ldflags="-H windowsgui -s -w" -trimpath -o logviewer.exe ./cmd/logviewer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shiftr-windows
          path: |
            *.exe
            settings.example.json
          retention-days: 7

  test:
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: go.sum

      - name: Debug Go env
        run: |
          go version
          go env

      - name: Test (with coverage)
        run: |
          go test ./internal/... ./pkg/... -coverprofile=coverage.out
          $cov = (go tool cover -func=coverage.out)
          $cov | Out-File -FilePath coverage.txt -Encoding utf8
          "## Coverage" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $cov | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          retention-days: 7
